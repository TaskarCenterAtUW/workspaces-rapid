name: Release to Azure Blob Storage

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'develop'
        type: choice
        options:
          - develop
          - staging
          - production
      version:
        description: 'Version to deploy'
        required: true
        default: 'latest'
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'develop'
        type: string
      version:
        description: 'Version to deploy'
        required: true
        default: 'latest'
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.environment }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '16'

      - name: Gather build artifacts
        run: |
          mkdir -p build
          cp -r dist/* build/
          echo "Files in build directory:"
          ls -R build

      - name: Upload to Azure Blob Storage
        uses: LanceMcCarthy/Action-AzureBlobUpload@v3
        with:
          source_folder: 'build'
          connection_string: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          container_name: 'editor'
          destination_folder: ${{ inputs.environment == 'develop' && 'dev' || inputs.environment == 'staging' && 'stage' || 'prod' }}
          delete_if_exists: true
